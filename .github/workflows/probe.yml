name: probe-tpex
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" https://www.tpex.org.tw/openapi/swagger.json -o s.json; head -c 200 s.json; echo
          python3 -c "
          import json;d=json.load(open('s.json'))
          for p,v in d['paths'].items():
              s=json.dumps(v,ensure_ascii=False)
              if any(k in s for k in ['股利','除權','營業收入','損益']): print(p, v.get('get',{}).get('summary',''))
          "
          curl -sS -A "Mozilla/5.0" -o d.txt -w "%{http_code}\n" https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap45_O; head -c 300 d.txt
