name: probe-tpex
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap39_O -o d.json
          python3 -c "
          import json;d=json.load(open('d.json'));print(len(d));print(json.dumps(d[0],ensure_ascii=False))
          print([json.dumps(r,ensure_ascii=False) for r in d if '3131' in json.dumps(r)][:3])
          "
