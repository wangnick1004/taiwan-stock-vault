name: 更新個股新聞

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 台灣時間 平日 07:30（盤前）
    - cron: "0 10 * * 1-5"    # 台灣時間 平日 18:00（盤後）
    - cron: "0 1 * * 0,6"     # 台灣時間 週末 09:00
  workflow_dispatch:
    inputs:
      only:
        description: "只處理這些代號（逗號分隔，空白＝全部），試跑用"
        required: false
        default: ""
      days:
        description: "抓最近幾天"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓新聞並寫入筆記
        env:
          ONLY_CODES: ${{ github.event.inputs.only }}
        run: python scripts/update_news.py --vault . --days "${{ github.event.inputs.days || '2' }}"
      - name: 推回 repo
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "沒有新內容"; exit 0; fi
          git commit -m "新聞更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
