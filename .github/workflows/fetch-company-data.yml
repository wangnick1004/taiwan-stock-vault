name: 下載公司基本資料與財務指標

on:
  push:
    branches: [claude/project-thread-hqxpyj]
    paths:
      - scripts/fetch_company_data.py
      - .github/workflows/fetch-company-data.yml
  schedule:
    - cron: "0 2 12 * *"   # 每月 12 日台灣時間 10:00（月營收公布後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-company-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_company_data.py _data/公司資料
      - name: 推回 repo
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data
          if git diff --cached --quiet; then echo "沒有變化"; exit 0; fi
          git commit -m "公司資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
